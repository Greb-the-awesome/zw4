<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #fff;
      font-family: "Teko", sans-serif;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      isolation: isolate;
    }

    .half {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .half--light {
      z-index: 1;
      background: #fff;
      color: #000;
    }

    .half--dark {
      z-index: 2;
      background: #000;
      color: #fff;
      clip-path: polygon(78% 0, 100% 0, 100% 100%, 22% 100%);
    }

    .title {
      width: max-content;
      max-width: 90vw;
      padding: 0.08em 0.28em 0.02em;
      border: 7px solid currentColor;
      font-size: clamp(4.5rem, 15vw, 14rem);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.01em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .half--light .title {
      box-shadow: 12px 12px 0 #000;
    }

    .half--dark .title {
      box-shadow: 12px 12px 0 #fff;
    }

    .corner-message {
      position: absolute;
      right: 28px;
      bottom: 22px;
      z-index: 3;
      width: min(320px, calc(100vw - 40px));
      color: #fff;
      font-size: clamp(1.4rem, 1.7vw, 1.6rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-align: right;
    }

    @media (max-width: 700px) {
      .half--dark {
        clip-path: polygon(88% 0, 100% 0, 100% 100%, 12% 100%);
      }

      .title {
        max-width: 92vw;
        border-width: 5px;
        font-size: clamp(3.3rem, 18vw, 7rem);
        white-space: normal;
      }

      .half--light .title,
      .half--dark .title {
        box-shadow: 8px 8px 0 currentColor;
      }

      .corner-message {
        right: 16px;
        bottom: 14px;
        width: min(260px, calc(100vw - 32px));
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="half half--light" aria-hidden="true">
      <h1 class="title">Coming Soon</h1>
    </section>

    <section class="half half--dark">
      <h1 class="title">Coming Soon</h1>
    </section>

    <p class="corner-message">
      Looking for my projects? Shoot me an fq on Instagram @grebosity! Most of my projects are on my highlights.
    </p>
  </main>
</body>
</html>
